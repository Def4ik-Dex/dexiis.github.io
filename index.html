<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DexIIs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1110;
    --card: #0F1110;
    --ring: #4C734D;
    --text: #E6E5E3;
    --gray: #A9A9A9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 100%; min-height: 100%; background: var(--bg); }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;      /* все по центру */
    padding-top: 163px;       /* верх картки як на макеті 2559x1039 */
    padding-bottom: 60px;
  }
  a { color: inherit; text-decoration: none; }
  img { display: block; }

  /* ---------- Картка 380x108 r11 ---------- */
  .card {
    position: relative;
    width: 380px;
    height: 108px;
    border-radius: 11px;
    background: var(--card) url('images/banner.png') center / cover no-repeat; /* фото 1 */
    overflow: hidden;
    flex-shrink: 0;
  }
  /* Аватарка: обводка 92x92 r34, товщина 2.6, колір 4C734D; лого 90x90 r33 */
  .avatar-ring {
    position: absolute;
    left: 50%;
    top: 8px;
    transform: translateX(-50%);
    width: 92px;
    height: 92px;
    border-radius: 34px;
    border: 2.6px solid var(--ring);
    overflow: hidden;
  }
  .avatar-ring img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 33px;
  }

  /* ---------- Нік: 5px від аватарки ---------- */
  .nick {
    margin-top: 0;            /* нік на ~3px нижче, ніж було */
    font-size: 36px;
    font-weight: 400;
    line-height: 36px;
    letter-spacing: .5px;
    color: var(--text);
  }

  /* ---------- Соцмережі: до іконки 61, до тексту ~74 ---------- */
  .socials {
    margin-top: 58px;         /* було 61, мінус 3px, на які опустили нік → іконки лишились на місці */
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 126px;
  }
  .social {
    display: flex;
    align-items: center;
    height: 46px;
  }
  .social .ico { width: 46px; height: 46px; object-fit: contain; }   /* фото 3 / 4 */
  .social .label {
    font-size: 26px;
    line-height: 26px;
    margin-left: 24px;
    margin-top: 6px;          /* текст трохи нижче: ~74px від ніка */
    color: var(--text);
  }
  .social .arrow { width: 14px; height: 14px; margin-left: 56px; object-fit: contain; } /* фото 5 */

  /* ---------- Сервер Kiwwi.fun: 69 від GitHub ---------- */
  .server {
    margin-top: 69px;
    display: flex;
    align-items: center;
  }
  .server .logo { width: 14px; height: 14px; object-fit: contain; }   /* фото 6 */
  .server .info { margin-left: 46px; text-align: center; }
  .server .name { font-size: 26px; line-height: 26px; color: var(--text); }
  .server .members { font-size: 17px; line-height: 24px; color: var(--text); margin-top: 2px; }
  .server .members b { font-weight: 400; font-size: 22px; margin-right: 6px; }
  .server .join {
    margin-left: 104px;
    display: flex;
    align-items: center;
    font-size: 17px;
    color: var(--text);
  }
  .server .join .arrow { width: 12px; height: 12px; margin-left: 56px; object-fit: contain; }

  /* ---------- Музичний плеєр: 82 від Kiwwi ---------- */
  .player { margin-top: 82px; display: flex; flex-direction: column; align-items: center; }
  .player .row { display: flex; align-items: center; }
  .player .cover { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }  /* фото 7 */
  .player .meta { margin-left: 8px; }
  .player .title { font-size: 20px; line-height: 22px; color: var(--text); white-space: nowrap; }
  .player .sub { font-size: 10px; line-height: 12px; color: var(--gray); text-align: center; }
  .player .time { font-size: 10px; color: var(--gray); margin-left: 12px; }
  .player .bar { width: 6px; height: 26px; border-radius: 3px; background: var(--ring); margin-left: 6px; }
  .player .controls { margin-top: 6px; display: flex; align-items: center; gap: 8px; }
  .player .controls button {
    background: none; border: 0; cursor: pointer; color: var(--text);
    display: flex; align-items: center;
  }
  .player .controls svg { width: 18px; height: 16px; fill: currentColor; }

  /* ---------- Телефон (підлаштуємо під твій макет, якщо надішлеш) ---------- */
  /* Макет 576x1146: усе те саме, Telegram по центру, GitHub під ним */
  @media (max-width: 700px) {
    body { padding-top: 257px; }
    .socials { flex-direction: column; gap: 59px; }  /* 59 між блоками = ~66 від тексту до тексту */
    .social:first-child { order: 1; }                /* Telegram зверху */
  }
</style>
</head>
<body>

  <!-- Картка + аватарка -->
  <div class="card">
    <div class="avatar-ring">
      <img src="images/avatar.png" alt="DexIIs">
    </div>
  </div>

  <div class="nick">DexIIs</div>

  <!-- GitHub / Telegram -->
  <div class="socials">
    <a class="social" href="https://github.com/" target="_blank" rel="noopener">
      <img class="ico" src="images/github.svg" alt="">
      <span class="label">GitHub</span>
      <img class="arrow" src="images/arrow.svg" alt="">
    </a>
    <a class="social" href="https://t.me/" target="_blank" rel="noopener">
      <img class="ico" src="images/telegram.svg" alt="">
      <span class="label">Telegram</span>
      <img class="arrow" src="images/arrow.svg" alt="">
    </a>
  </div>

  <!-- Сервер -->
  <div class="server">
    <img class="logo" src="images/kiwwi.svg" alt="">
    <div class="info">
      <div class="name">Kiwwi.fun</div>
      <div class="members"><b>0</b>Members</div>
    </div>
    <a class="join" href="#" target="_blank" rel="noopener">
      Join channel
      <img class="arrow" src="images/arrow.svg" alt="">
    </a>
  </div>

  <!-- Музичний плеєр -->
  <div class="player">
    <div class="row">
      <img class="cover" src="images/music.png" alt="">
      <div class="meta">
        <div class="title">Flip Flop Fliep Flap</div>
        <div class="sub">spotify.exe</div>
      </div>
      <span class="time">1:20</span>
      <span class="bar"></span>
    </div>
    <div class="controls">
      <button aria-label="Prev"><svg viewBox="0 0 18 16"><path d="M17 1v14L6 8z"/><rect x="1" y="1" width="3" height="14"/></svg></button>
      <button aria-label="Pause"><svg viewBox="0 0 18 16"><rect x="3" y="1" width="4" height="14"/><rect x="11" y="1" width="4" height="14"/></svg></button>
      <button aria-label="Next"><svg viewBox="0 0 18 16"><path d="M1 1v14l11-7z"/><rect x="14" y="1" width="3" height="14"/></svg></button>
    </div>
  </div>

</body>
</html>
